worker_processes auto;
# Platform journal (ADR-0050): diagnostics on stderr; access/request off by default.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Forwarded client identity (ADR-0052): overwrite from public TCP peer; never append.
    # RFC 7239 for= — IPv6 must be bracketed and quoted.
    map $remote_addr $forwarded_client_for {
        ~^[0-9.]+$        "for=$remote_addr";
        ~^[0-9A-Fa-f:.]+$ "for=\"[$remote_addr]\"";
        default           "for=unknown";
    }
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Forwarded        "$forwarded_client_for;proto=$scheme;host=$host";

    # Empty Edge: ACME HTTP-01 on :80; everything else is a real HTTP 404 (ADR-0007 / ADR-0013).
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }

        location / {
            return 404;
        }
    }

    # Domain fronts (Edge-owned TLS servers + /healthcheck + :80 redirect). ADR-0028.
    # Workload Routes attach only via include …/edge-routes/*--<fqdn>.conf inside each front.
    include /etc/nginx/edge-domains/*.conf;
}
