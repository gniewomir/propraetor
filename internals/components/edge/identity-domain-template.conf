# Identity issuer Domain front for __FQDN__ — Edge-owned (ADR-0057).
# Proxies publicly to the Identity Service Network dial name; no Workload Routes.
server {
    listen 80;
    listen [::]:80;
    server_name __FQDN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __FQDN__;

    ssl_certificate     /etc/nginx/certs/__FQDN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/__FQDN__/privkey.pem;

    location = /healthcheck {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        proxy_pass http://identity:1411;
    }
}
