#cloud-config
ssh_pwauth: false
# Host Image apt indexes are enough to install podman; skip apt-get update on
# create (faster Park->Apply). Revisit when Propraetor leaves dev-only.
package_update: false
packages:
  - podman
users:
  - name: platform
    lock_passwd: true
    shell: /bin/bash
# Apply port floor before packages/runcmd so early Edge install cannot race (ADR-0006).
bootcmd:
  - [ sysctl, -w, net.ipv4.ip_unprivileged_port_start=80 ]
  # DigitalOcean sets root with lastchg=0 (must change password on first login).
  # Pubkey auth then still hits PAM expiry: BatchMode / non-TTY SSH fails with
  # "Password change required but no TTY available" - Lifecycle wait and
  # Acceptance host_ssh look "unreachable" while interactive ./ssh.sh appears up.
  # Clear ageing and lock the password; root login stays pubkey-only (ssh_pwauth: false).
  # Quote -1: bare YAML integers fail cloud-init 26.1+ bootcmd schema (strings only).
  - [ chage, -d, "-1", -M, "-1", root ]
  - [ passwd, -l, root ]
write_files:
  # Root Host login from Operator Configuration (ADR-0037). Written in config
  # stage before ADR-0030 power_state reboot so first reachable SSH has the key.
  - path: /root/.ssh/authorized_keys
    owner: root:root
    permissions: "0600"
    content: |
      ${host_root_ssh_public_key}
  - path: /etc/sysctl.d/99-unprivileged-port-start.conf
    content: |
      net.ipv4.ip_unprivileged_port_start=80
  # Non-default SSH Port (ADR-0030). DO documented cutover: set Port, then reboot
  # (power_state below). Firewall allows only ssh_port; :22 is DROPped after cutover.
  - path: /etc/ssh/sshd_config.d/99-ssh-port.conf
    content: |
      Port ${ssh_port}
  # Linger file in config stage so Platform User linger holds even if DigitalOcean
  # vendor scripts fail in final and skip scripts_user / runcmd (ADR-0008).
  - path: /var/lib/systemd/linger/platform
    content: ""
    permissions: "0644"
  # Platform journal Substrate (ADR-0050): persistent Host journal with modest
  # caps for s-1vcpu-1gb-class public Hosts. SystemMaxUse=200M is the intentional
  # initial budget; peers keep vacuum from filling root or runtime tmpfs.
  - path: /etc/systemd/journald.conf.d/99-platform-journal.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=200M
      SystemKeepFree=200M
      RuntimeMaxUse=50M
  # Platform journal capture pin (ADR-0050): Platform User Podman log_driver so
  # containers do not silently fall back to k8s-file. No per-Quadlet LogDriver=.
  # defer: true - write_files runs before users_groups; without defer, owner
  # platform:platform raises Unknown user and aborts the rest of write_files
  # (Host Volume units never land). write_files_deferred runs in final after
  # the Platform User exists.
  - path: /home/platform/.config/containers/containers.conf
    owner: platform:platform
    permissions: "0644"
    defer: true
    content: |
      [containers]
      log_driver = "journald"
  # Host Volume mount without scripts_user (ADR-0031).
  - path: /usr/local/lib/host-volume/ensure-host-volume-mount.sh
    permissions: "0755"
    content: ${ensure_host_volume_mount_sh}
  - path: /etc/systemd/system/host-volume.service
    content: |
      [Unit]
      Description=Host Volume at /host-volume
      DefaultDependencies=no
      After=local-fs-pre.target systemd-udev-settle.service
      Before=multi-user.target
      Conflicts=umount.target
      StartLimitIntervalSec=300
      StartLimitBurst=60

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/lib/host-volume/ensure-host-volume-mount.sh /dev/disk/by-id/scsi-0DO_Volume_${volume_name}
      TimeoutStartSec=60
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  # Config-stage WantedBy symlink (cloud-init write_files cannot create symlinks).
  - path: /etc/tmpfiles.d/host-volume.conf
    content: |
      L+ /etc/systemd/system/multi-user.target.wants/host-volume.service - - - - /etc/systemd/system/host-volume.service
  # Late attach after Host create: start the oneshot when the by-id device appears
  # (first boot may finish multi-user before tmpfiles creates the WantedBy link).
  - path: /etc/udev/rules.d/99-host-volume.rules
    content: |
      ACTION=="add", SUBSYSTEM=="block", ENV{DEVTYPE}=="disk", ENV{ID_SERIAL}=="0DO_Volume_${volume_name}", TAG+="systemd", ENV{SYSTEMD_WANTS}+="host-volume.service"
mounts:
  - [ /dev/disk/by-id/scsi-0DO_Volume_${volume_name}, /host-volume, ext4, "defaults,nofail,discard,noatime", "0", "2" ]
runcmd:
  - sysctl --system
  - loginctl enable-linger platform
  # ADR-0050: pick up journald drop-in before later Substrate probing (IHP Done).
  - systemctl restart systemd-journald
  # Optional accelerate when scripts_user runs; udev + tmpfiles cover vendor-skip.
  - systemd-tmpfiles --create /etc/tmpfiles.d/host-volume.conf
  - systemctl daemon-reload
  - udevadm control --reload-rules
  - udevadm trigger --action=add --subsystem-match=block
  - systemctl start host-volume.service
# DO documented SSH port cutover: reboot after Port is on disk so sshd-socket-generator
# / ssh.socket pick it up. Module frequency is once per instance (no reboot loop).
power_state:
  mode: reboot
  delay: now
  message: Propraetor ADR-0030 SSH port cutover
  condition: true
